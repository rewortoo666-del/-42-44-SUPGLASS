<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>П42-44 SUPGLASS | Оптовый склад</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fc;--tx:#0b1b33;--mu:#6b7c93;--ac:#0077ff;--bd:rgba(15,40,80,.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);max-width:430px;margin:0 auto;padding:12px 14px 110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:19px;font-weight:800;letter-spacing:.04em}
.sub{font-size:10px;color:var(--mu);font-weight:600;margin-top:2px}
.mgr{width:38px;height:38px;border-radius:50%;background:var(--ac);display:grid;place-items:center;color:#fff;text-decoration:none;font-size:17px}
.hero{background:linear-gradient(135deg,#eaf3ff,#dceaff);border:1px solid rgba(0,119,255,.15);border-radius:20px;padding:16px;margin-bottom:12px}
.hero h2{font-size:20px;font-weight:800;line-height:1.15}.hero p{font-size:11px;color:#4a5d75;margin-top:6px;line-height:1.5}
.search{width:100%;height:42px;border-radius:14px;border:1px solid var(--bd);padding:0 14px;font:600 14px Inter;margin-bottom:10px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--bd);background:#fff;font:700 12px Inter;color:var(--tx)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:10px;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(15,40,90,.06)}
.ph{height:96px;border-radius:12px;background:#eef4fc;display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--mu);font-weight:700;text-align:center}
.ph img{width:100%;height:100%;object-fit:cover}
.card h4{font-size:12px;font-weight:800;line-height:1.25;margin-top:8px;min-height:30px}
.price{color:var(--ac);font-size:18px;font-weight:800;margin-top:4px}
.st{font-size:10px;font-weight:700;color:#0a9f55;margin-top:2px}
.row{display:flex;gap:4px;margin-top:auto;padding-top:8px}
.row button{width:30px;height:34px;border:1px solid var(--bd);background:#f0f4fa;border-radius:10px;font:800 16px Inter}
.row input{width:100%;min-width:0;height:34px;text-align:center;border:1px solid var(--bd);border-radius:10px;font:800 13px Inter}
.add{margin-top:6px;height:36px;border:0;border-radius:12px;background:linear-gradient(135deg,#0066ee,#1e92ff);color:#fff;font:800 12px Inter}
.add:active{transform:scale(.96)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:calc(100% - 28px);max-width:402px;height:52px;border:0;border-radius:16px;background:var(--tx);color:#fff;font:800 14px Inter;display:none;justify-content:space-between;align-items:center;padding:0 18px;box-shadow:0 10px 28px rgba(0,20,60,.3)}
.sheet{position:fixed;inset:0;background:rgba(10,25,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.open{display:flex}
.panel{background:#fff;width:100%;max-width:430px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px}
.panel h3{font-size:20px;margin-bottom:10px}
.it{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border-radius:12px;padding:10px;margin-bottom:6px;font-size:12px;font-weight:700}
.it small{display:block;color:var(--mu);font-weight:600}
.in{width:100%;height:44px;border:1px solid var(--bd);border-radius:12px;padding:0 12px;font:600 14px Inter;margin-top:8px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0 10px}
.send{width:100%;height:50px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:800 15px Inter}
.note{font-size:11px;color:var(--mu);margin-top:8px}
</style></head><body>
<header><div><h1>П42-44 SUPGLASS</h1><div class="sub">Acefast · Joyroom · Momax · Hoco · K-DOO · MOSBROS</div></div>
<a class="mgr" href="https://t.me/supglass4244">✈</a></header>
<div class="hero"><h2>Оптовый склад аксессуаров</h2><p>ТЯК «Москва» (Люблино), пав. П42/44<br>Единая оптовая цена · Автобус ТЯК или любая ТК по России</p></div>
<input class="search" id="q" placeholder="Поиск: Acefast, кабель, стекло…" oninput="draw()">
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<button class="bar" id="bar" onclick="openCart()"><span id="bc"></span><span id="bs"></span></button>

<div class="sheet" id="sh" onclick="if(event.target===this)this.classList.remove('open')"><div class="panel">
<h3>Корзина</h3><div id="items"></div>
<input class="in" id="nm" placeholder="Имя *"><input class="in" id="ph" type="tel" placeholder="Телефон *">
<input class="in" id="sp" placeholder="Способ доставки (автобус ТЯК, СДЭК, ПЭК… + город/ПВЗ) *">
<div class="note">Оплату в приложении не проводим: реквизиты придут в чат бота.</div>
<div class="tot"><span>Итого</span><span id="tt"></span></div>
<button class="send" onclick="send()">Отправить заявку</button></div></div>

<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const $=i=>document.getElementById(i),R=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
let P=[],cat='Все',cart={};
fetch('catalog.json?'+Date.now()).then(r=>r.json()).then(d=>{P=d;init()}).catch(()=>{$('grid').innerHTML='<p class="note">Не удалось загрузить каталог</p>'});
function init(){const cs=['Все',...new Set(P.map(p=>p.cat))];
 $('chips').innerHTML=cs.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';init()">${c}</button>`).join('');draw()}
function draw(){const q=$('q').value.toLowerCase();
 const L=P.filter(p=>(cat=='Все'||p.cat==cat)&&(p.name+p.id).toLowerCase().includes(q));
 $('grid').innerHTML=L.map(p=>{const n=cart[p.id]?.qty||1;return `<div class="card">
 <div class="ph">${p.img?`<img src="${p.img}" loading="lazy">`:p.id}</div><h4>${p.name}</h4>
 <div class="price">${R(p.price)}</div><div class="st">${p.stock?'В наличии: '+p.stock+' шт':'В наличии'}</div>
 <div class="row"><button onclick="step('${p.id}',-1)">−</button><input id="q_${p.id}" type="number" min="1" inputmode="numeric" value="${n}"><button onclick="step('${p.id}',1)">+</button></div>
 <button class="add" onclick="add('${p.id}')">В корзину</button></div>`}).join('')||'<p class="note">Ничего не найдено</p>'}
function step(id,d){const e=$('q_'+id);e.value=Math.max(1,(+e.value||1)+d)}
function add(id){const p=P.find(x=>x.id==id),q=Math.max(1,+$('q_'+id).value||1);cart[id]={p,qty:q};upd();tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light')}
function sum(){return Object.values(cart).reduce((s,i)=>s+i.p.price*i.qty,0)}
function upd(){const k=Object.keys(cart).length;$('bar').style.display=k?'flex':'none';$('bc').textContent='🛒 '+k+' поз.';$('bs').textContent=R(sum())}
function openCart(){$('items').innerHTML=Object.values(cart).map(i=>`<div class="it"><div>${i.p.name}<small>${i.qty} шт × ${R(i.p.price)}</small></div><div>${R(i.p.price*i.qty)}<br><a href="#" onclick="del('${i.p.id}');return false" style="color:#e11d2e">убрать</a></div></div>`).join('');
 $('tt').textContent=R(sum());$('sh').classList.add('open')}
function del(id){delete cart[id];upd();Object.keys(cart).length?openCart():$('sh').classList.remove('open')}
function send(){const nm=$('nm').value.trim(),ph=$('ph').value.trim(),sp=$('sp').value.trim();
 if(!nm||!ph||!sp)return alert('Заполните имя, телефон и способ доставки');
 if(!tg||!tg.sendData)return alert('Откройте витрину через кнопку в Telegram-боте');
 const items=Object.values(cart).map(i=>({id:i.p.id,title:i.p.name,qty:i.qty,total:i.p.price*i.qty}));
 tg.sendData(JSON.stringify({name:nm,phone:ph,ship:sp,items,total:sum()}))}
</script></body></html>
